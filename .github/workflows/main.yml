name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: node prepare.js
      - run: mkdir -p assets && mv icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/
      - run: npx cap add android
      - name: Camera permission
        run: sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Logo and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ff5c8a' --splashBackgroundColor '#0f0a1f' --splashBackgroundColorDark '#0f0a1f'
      - run: npx cap sync android
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KHAN-3150-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
